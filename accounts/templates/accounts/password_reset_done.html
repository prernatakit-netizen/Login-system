<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Password Reset</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background: #f4f6f8;
            margin: 0;
        }

        .container {
            width: 400px;
            margin: 100px auto;
            background: white;
            padding: 30px;
            border-radius: 10px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
            text-align: center;
        }

        h1 {
            margin-bottom: 20px;
        }

        p {
            color: #555;
            line-height: 1.5;
        }

        a {
            display: inline-block;
            margin-top: 20px;
            color: #0d6efd;
            text-decoration: none;
        }
    </style>
</head>

<body>

    <div class="container">

        <h1>Check Your Email</h1>

        <p>
            If an account exists with the email address you entered,
            a password reset link has been sent.
        </p>

        <p>
            Check the terminal where your Django server is running
            for the reset link.
        </p>

        <a href="{% url 'login' %}">
            ← Back to Login
        </a>

    </div>

</body>
</html>
