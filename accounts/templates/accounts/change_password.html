<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Change Password - File Manager</title>

    <style>

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #f4f6f9;
            min-height: 100vh;
        }

        .navbar {
            background: #1f2937;
            color: white;

            padding: 18px 40px;

            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .navbar h2 {
            margin: 0;
        }

        .nav-links {
            display: flex;
            gap: 10px;
        }

        .nav-links a {
            color: white;
            text-decoration: none;
            padding: 8px 14px;
            border-radius: 6px;
        }

        .nav-links a:hover {
            background: #374151;
        }

        .container {
            max-width: 550px;
            margin: 60px auto;
            padding: 0 20px;
        }

        .password-card {
            background: white;
            padding: 35px;

            border-radius: 12px;

            box-shadow:
                0 4px 15px rgba(0,0,0,0.08);
        }

        .icon {
            text-align: center;
            font-size: 50px;
            margin-bottom: 10px;
        }

        h1 {
            text-align: center;
            margin-bottom: 10px;
        }

        .subtitle {
            text-align: center;
            color: #777;
            margin-bottom: 30px;
        }

        form p {
            margin-bottom: 18px;
        }

        label {
            display: block;
            font-weight: bold;
            margin-bottom: 7px;
        }

        input {
            width: 100%;

            padding: 12px;

            border: 1px solid #ccc;

            border-radius: 7px;

            font-size: 15px;
        }

        input:focus {
            outline: none;
            border-color: #2563eb;
        }

        .helptext {
            display: block;
            color: #777;
            font-size: 12px;
            margin-top: 6px;
            line-height: 1.5;
        }

        .errorlist {
            color: #dc3545;
            font-size: 13px;
            padding-left: 18px;
        }

        .success {
            background: #d1e7dd;
            color: #0f5132;

            padding: 12px;

            border-radius: 7px;

            margin-bottom: 20px;
        }

        .button {
            width: 100%;

            padding: 13px;

            border: none;

            border-radius: 7px;

            background: #2563eb;

            color: white;

            font-size: 16px;

            font-weight: bold;

            cursor: pointer;
        }

        .button:hover {
            background: #1d4ed8;
        }

        .back {
            display: block;

            text-align: center;

            margin-top: 20px;

            color: #2563eb;

            text-decoration: none;
        }

        @media (max-width: 600px) {

            .navbar {
                padding: 15px 20px;

                flex-direction: column;

                gap: 10px;
            }

            .password-card {
                padding: 25px 20px;
            }

        }

    </style>

</head>

<body>

<div class="navbar">

    <h2>File Manager</h2>

    <div class="nav-links">

        <a href="{% url 'dashboard' %}">
            Dashboard
        </a>

        <a href="{% url 'logout' %}">
            Logout
        </a>

    </div>

</div>


<div class="container">

    <div class="password-card">

        <div class="icon">
            🔒
        </div>

        <h1>
            Change Password
        </h1>

        <p class="subtitle">
            Keep your account secure with a strong password.
        </p>


        {% if messages %}

            {% for message in messages %}

                <div class="success">
                    {{ message }}
                </div>

            {% endfor %}

        {% endif %}


        <form method="POST">

            {% csrf_token %}

            {{ form.as_p }}

            <button
                type="submit"
                class="button"
            >
                Change Password
            </button>

        </form>


        <a
            href="{% url 'profile' %}"
            class="back"
        >
            ← Back to Profile
        </a>

    </div>

</div>

</body>

</html>
