<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Upload File</title>

    <style>

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #f4f6f9;
            color: #222;
        }

        .navbar {
            background: #1f2937;
            color: white;
            padding: 18px 40px;

            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .navbar h2 {
            margin: 0;
        }

        .nav-links {
            display: flex;
            gap: 10px;
        }

        .nav-links a {
            color: white;
            text-decoration: none;
            padding: 8px 14px;
            border-radius: 6px;
        }

        .nav-links a:hover {
            background: #374151;
        }

        .container {
            max-width: 600px;
            margin: 60px auto;
            padding: 0 20px;
        }

        .upload-card {
            background: white;
            padding: 35px;
            border-radius: 12px;

            box-shadow:
                0 3px 12px rgba(0,0,0,0.08);
        }

        h1 {
            margin-top: 0;
            text-align: center;
        }

        .subtitle {
            text-align: center;
            color: #777;
            margin-bottom: 30px;
        }

        .file-area {
            border: 2px dashed #cbd5e1;
            border-radius: 10px;

            padding: 35px 20px;

            text-align: center;

            margin-bottom: 20px;
        }

        .file-icon {
            font-size: 45px;
            margin-bottom: 10px;
        }

        input[type="file"] {
            width: 100%;
            padding: 10px;
        }

        .upload-button {
            width: 100%;

            padding: 13px;

            background: #2563eb;
            color: white;

            border: none;
            border-radius: 7px;

            font-size: 16px;
            font-weight: bold;

            cursor: pointer;
        }

        .upload-button:hover {
            background: #1d4ed8;
        }

        .back {
            display: block;

            text-align: center;

            margin-top: 20px;

            color: #2563eb;

            text-decoration: none;
        }

        .errorlist {
            color: #dc3545;
            padding-left: 20px;
        }

        @media (max-width: 600px) {

            .navbar {
                padding: 15px 20px;

                flex-direction: column;

                gap: 10px;
            }

            .upload-card {
                padding: 25px 20px;
            }

        }

    </style>

</head>

<body>


<!-- NAVBAR -->

<div class="navbar">

    <h2>File Manager</h2>

    <div class="nav-links">

        <a href="{% url 'dashboard' %}">
            Dashboard
        </a>

        <a href="{% url 'logout' %}">
            Logout
        </a>

    </div>

</div>


<!-- UPLOAD -->

<div class="container">

    <div class="upload-card">

        <h1>
            Upload File
        </h1>

        <p class="subtitle">
            Select a file from your device to upload.
        </p>


        <form
            method="POST"
            enctype="multipart/form-data"
        >

            {% csrf_token %}

            <div class="file-area">

                <div class="file-icon">
                    📁
                </div>

                {{ form.as_p }}

            </div>


            <button
                type="submit"
                class="upload-button"
            >
                Upload File
            </button>

        </form>


        <a
            href="{% url 'dashboard' %}"
            class="back"
        >
            ← Back to Dashboard
        </a>

    </div>

</div>

</body>

</html>
